<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG // HABITS & SMOKE FREE</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --border: #e5e5e5;
      --font: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      border: 2px solid var(--fg);
      padding: 24px;
      box-shadow: 6px 6px 0px var(--fg);
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .kpi-card {
      border: 1px solid var(--fg);
      text-align: center;
      padding: 12px 6px;
    }

    .kpi-val {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .kpi-lbl {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    button.wake-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--fg);
      color: var(--bg);
      border: none;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button.wake-btn:hover { background-color: #333; }

    button.smoke-btn {
      width: 100%;
      padding: 8px;
      background-color: var(--bg);
      color: var(--fg);
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button.smoke-btn:hover { background-color: #f0f0f0; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .add-btn {
      background: none;
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 2px 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover { background: var(--fg); color: var(--bg); }

    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 0.8rem;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--fg);
      cursor: pointer;
    }

    .remove-btn {
      color: #999;
      cursor: pointer;
      font-size: 0.7rem;
      margin-left: 6px;
    }

    .remove-btn:hover { color: var(--fg); font-weight: bold; }

    #status {
      margin-top: 16px;
      font-size: 0.7rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>LOG // TRACKER</h1>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-val" id="smokeStreakDisplay">0</div>
        <div class="kpi-lbl">Smoke Free (Days)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val" id="streakDisplay">--</div>
        <div class="kpi-lbl">&lt; 5 AM Streak</div>
      </div>
    </div>

    <button type="button" class="wake-btn" id="wakeBtn" onclick="logWakeUp()">LOG WAKE UP NOW</button>
    <button type="button" class="smoke-btn" onclick="resetSmokeQuitDate()">Reset Smoke Quit Date</button>

    <div class="section-header">
      <label>Additional Habits</label>
      <button type="button" class="add-btn" onclick="addNewHabit()">+ Add Habit</button>
    </div>
    <div class="checkbox-group" id="habitsContainer"></div>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz06Huj6D6PvgvmsxX7vgAQTyM-FNmIz5f9-Vau8QYOh37aJuu2n887DUVVN_sCKm_3_A/exec';
    let extraHabits = JSON.parse(localStorage.getItem('saved_habit_labels')) || ['Reading', 'Exercise'];
    let smokeQuitDate = localStorage.getItem('smoke_quit_date') || '2026-08-01';

    function getSmokeStreakDays() {
      const quit = new Date(smokeQuitDate);
      const today = new Date();
      const diffTime = today - quit;
      return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
    }

    function calculateSmokeStreak() {
      document.getElementById('smokeStreakDisplay').innerText = getSmokeStreakDays();
    }

    function resetSmokeQuitDate() {
      if (confirm("Reset smoke quit date to today?")) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        
        smokeQuitDate = `${year}-${month}-${day}`;
        localStorage.setItem('smoke_quit_date', smokeQuitDate);
        calculateSmokeStreak();
        document.getElementById('status').innerText = "[!] SMOKE QUIT DATE RESET TO TODAY";
      }
    }

    function fetchCurrentStreak() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            document.getElementById('streakDisplay').innerText = data.streak;
          }
        })
        .catch(() => {
          document.getElementById('streakDisplay').innerText = '0';
        });
    }

    function renderHabitInputs() {
      const container = document.getElementById('habitsContainer');
      container.innerHTML = '';
      extraHabits.forEach((habit, idx) => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `
          <span>${habit} <span class="remove-btn" onclick="removeHabit(${idx})">[x]</span></span>
          <input type="checkbox" id="habit_${idx}">
        `;
        container.appendChild(div);
      });
      localStorage.setItem('saved_habit_labels', JSON.stringify(extraHabits));
    }

    function addNewHabit() {
      const name = prompt("Enter new habit name:");
      if (name && name.trim() !== '') {
        extraHabits.push(name.trim());
        renderHabitInputs();
      }
    }

    function removeHabit(idx) {
      extraHabits.splice(idx, 1);
      renderHabitInputs();
    }

    function logWakeUp() {
      const wakeBtn = document.getElementById('wakeBtn');
      const statusDiv = document.getElementById('status');

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const currentDate = `${year}-${month}-${day}`;
      const currentTime = `${hours}:${minutes}`;

      wakeBtn.disabled = true;
      wakeBtn.innerText = "SAVING...";
      statusDiv.innerText = "";

      const habitsData = {};
      extraHabits.forEach((habit, idx) => {
        const chk = document.getElementById(`habit_${idx}`);
        if (chk) habitsData[habit] = chk.checked;
      });

      const payload = {
        date: currentDate,
        wakeTime: currentTime,
        smokeStreak: getSmokeStreakDays(),
        habits: habitsData
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] LOGGED TO SHEET AT ${currentTime}`;
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";

        extraHabits.forEach((_, idx) => {
          const chk = document.getElementById(`habit_${idx}`);
          if (chk) chk.checked = false;
        });

        setTimeout(fetchCurrentStreak, 1000);
      })
      .catch(err => {
        statusDiv.innerText = "[X] ERROR RECORDING";
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";
      });
    }

    renderHabitInputs();
    fetchCurrentStreak();
    calculateSmokeStreak();
  </script>
</body>
</html>

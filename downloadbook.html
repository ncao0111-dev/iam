<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Public Domain Ebook Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9f9f9;
      color: #222;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: #000;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { background-color: #888; cursor: not-allowed; }
    
    .results {
      margin-top: 32px;
    }
    .book-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .book-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .book-author {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 12px;
    }
    .download-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .download-link {
      display: inline-block;
      padding: 6px 12px;
      background-color: #f0f0f0;
      color: #000;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }
    .download-link:hover {
      background-color: #e0e0e0;
    }
    .not-found {
      color: #888;
      font-style: italic;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Public Domain Book Finder</h1>
    <p class="subtitle">Enter one or several book titles (one per line) to find direct Gutenberg download links.</p>

    <textarea id="bookInput" placeholder="Frankenstein - Mary Shelley&#10;Pride and Prejudice&#10;The Adventures of Sherlock Holmes"></textarea>
    <button id="searchBtn" onclick="processBooks()">Find Download Links</button>

    <div class="results" id="resultsContainer"></div>
  </div>

  <script>
    async function searchBook(queryText) {
      const query = encodeURIComponent(queryText.trim());
      try {
        const response = await fetch(`https://gutendex.com/books/?search=${query}`);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const book = data.results[0];
          const formats = book.formats;

          // Extract standard formats
          const links = [];
          if (formats['application/epub+zip']) {
            links.push({ type: 'EPUB', url: formats['application/epub+zip'] });
          }
          if (formats['application/x-mobipocket-ebook']) {
            links.push({ type: 'Kindle/Mobi', url: formats['application/x-mobipocket-ebook'] });
          }
          if (formats['text/html']) {
            links.push({ type: 'HTML', url: formats['text/html'] });
          }
          if (formats['text/plain; charset=utf-8']) {
            links.push({ type: 'Plain Text', url: formats['text/plain; charset=utf-8'] });
          }

          return {
            query: queryText,
            title: book.title,
            authors: book.authors.map(a => a.name).join(', ') || 'Unknown Author',
            links: links
          };
        }
      } catch (err) {
        console.error("Search error:", err);
      }
      return { query: queryText, notFound: true };
    }

    async function processBooks() {
      const input = document.getElementById('bookInput').value.trim();
      const resultsContainer = document.getElementById('resultsContainer');
      const searchBtn = document.getElementById('searchBtn');

      if (!input) return;

      const titles = input.split('\n').filter(line => line.trim().length > 0);
      
      resultsContainer.innerHTML = '';
      searchBtn.disabled = true;
      searchBtn.innerText = 'Searching...';

      for (const rawQuery of titles) {
        const result = await searchBook(rawQuery);

        if (result.notFound || result.links.length === 0) {
          resultsContainer.innerHTML += `
            <div class="not-found">
              No public-domain matches found for: <strong>"${rawQuery}"</strong>
            </div>
          `;
        } else {
          const linksHTML = result.links.map(
            link => `<a class="download-link" href="${link.url}" target="_blank" download>${link.type}</a>`
          ).join('');

          resultsContainer.innerHTML += `
            <div class="book-card">
              <div class="book-title">${result.title}</div>
              <div class="book-author">By ${result.authors}</div>
              <div class="download-links">${linksHTML}</div>
            </div>
          `;
        }
      }

      searchBtn.disabled = false;
      searchBtn.innerText = 'Find Download Links';
    }
  </script>
</body>
</html>

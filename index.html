<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG // HABIT STACKER</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --border: #e5e5e5;
      --font: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      border: 2px solid var(--fg);
      padding: 24px;
      box-shadow: 6px 6px 0px var(--fg);
    }

    .quote-box {
      border: 1px solid var(--fg);
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
      background: #fafafa;
    }

    .quote-text {
      font-size: 0.8rem;
      font-style: italic;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .quote-author {
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .kpi-card {
      border: 1px solid var(--fg);
      text-align: center;
      padding: 12px 6px;
    }

    .kpi-val {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .kpi-lbl {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    button.wake-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--fg);
      color: var(--bg);
      border: none;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button.wake-btn:hover { background-color: #333; }

    /* ROUTINE STACK MODAL BOX */
    .routine-box {
      display: none;
      border: 2px solid var(--fg);
      padding: 14px;
      margin-bottom: 20px;
      background: #fdfdfd;
    }

    .routine-box.active {
      display: block;
    }

    .routine-title {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .routine-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      padding: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .routine-item.done {
      text-decoration: line-through;
      opacity: 0.5;
      background: #f0f0f0;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    button.secondary-btn {
      width: 100%;
      padding: 8px;
      background-color: var(--bg);
      color: var(--fg);
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button.secondary-btn:hover { background-color: #f0f0f0; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      margin-top: 10px;
    }

    label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .add-btn {
      background: none;
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 2px 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover { background: var(--fg); color: var(--bg); }

    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 0.8rem;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--fg);
      cursor: pointer;
    }

    .remove-btn {
      color: #999;
      cursor: pointer;
      font-size: 0.7rem;
      margin-left: 6px;
    }

    .remove-btn:hover { color: var(--fg); font-weight: bold; }

    #screenshotInput { display: none; }

    #status {
      margin-top: 16px;
      font-size: 0.7rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="quote-box">
      <div class="quote-text" id="quoteText">"Loading daily motivation..."</div>
      <div class="quote-author" id="quoteAuthor">--</div>
    </div>

    <h1>LOG // TRACKER</h1>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-val" id="smokeStreakDisplay">0</div>
        <div class="kpi-lbl">Smoke Free (Days)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val" id="streakDisplay">--</div>
        <div class="kpi-lbl">&lt; 5 AM Streak</div>
      </div>
    </div>

    <button type="button" class="wake-btn" id="wakeBtn" onclick="logWakeUp()">LOG WAKE UP NOW</button>
    
    <!-- DYNAMIC ROUTINE STACK AREA (APPEARS UPON LOGGING WAKE UP) -->
    <div class="routine-box" id="routineBox">
      <div class="routine-title">⚡ ROUTINE STACK (CHECK AS YOU GO)</div>
      <div id="routineListContainer"></div>
      <button type="button" class="secondary-btn" style="margin-top:10px;" onclick="closeRoutineBox()">COMPLETE ROUTINE STACK</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="triggerScreenshotUpload()">+ Extract Screenshot</button>
      <button type="button" class="secondary-btn" onclick="addSexActivity()">+ Sex Activity</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="addQuote()">+ Add Quote</button>
      <button type="button" class="secondary-btn" onclick="addKeyword()">+ Add Keyword</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="manageRoutineList()">⚙ Manage Routines</button>
      <button type="button" class="secondary-btn" onclick="resetSmokeQuitDate()">Reset Smoke Quit</button>
    </div>

    <!-- Hidden file picker -->
    <input type="file" id="screenshotInput" accept="image/*" multiple onchange="handleScreenshotUpload(event)">

    <div class="section-header">
      <label>Additional Habits</label>
      <button type="button" class="add-btn" onclick="addNewHabit()">+ Add Habit</button>
    </div>
    <div class="checkbox-group" id="habitsContainer"></div>

    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz06Huj6D6PvgvmsxX7vgAQTyM-FNmIz5f9-Vau8QYOh37aJuu2n887DUVVN_sCKm_3_A/exec';
    let extraHabits = JSON.parse(localStorage.getItem('saved_habit_labels')) || ['Reading', 'Exercise'];
    let routineStack = JSON.parse(localStorage.getItem('saved_routine_stack')) || ['Drink 500ml Water', 'Make Bed', '5 Min Stretch', 'Cold Shower'];
    let smokeQuitDate = localStorage.getItem('smoke_quit_date') || '2026-08-01';

    function getSmokeStreakDays() {
      const quit = new Date(smokeQuitDate);
      const today = new Date();
      const diffTime = today - quit;
      return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
    }

    function calculateSmokeStreak() {
      document.getElementById('smokeStreakDisplay').innerText = getSmokeStreakDays();
    }

    function resetSmokeQuitDate() {
      if (confirm("Reset smoke quit date to today?")) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        
        smokeQuitDate = `${year}-${month}-${day}`;
        localStorage.setItem('smoke_quit_date', smokeQuitDate);
        calculateSmokeStreak();
        document.getElementById('status').innerText = "[!] SMOKE QUIT DATE RESET TO TODAY";
      }
    }

    function fetchDashboardData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            document.getElementById('streakDisplay').innerText = data.streak;
            document.getElementById('quoteText').innerText = `"${data.quote}"`;
            document.getElementById('quoteAuthor').innerText = `- ${data.author}`;
            if (data.routines && data.routines.length > 0) {
              routineStack = data.routines;
              localStorage.setItem('saved_routine_stack', JSON.stringify(routineStack));
            }
          }
        })
        .catch(() => {
          document.getElementById('streakDisplay').innerText = '0';
          document.getElementById('quoteText').innerText = '"Every day is a new beginning."';
          document.getElementById('quoteAuthor').innerText = '- UNKNOWN';
        });
    }

    function renderHabitInputs() {
      const container = document.getElementById('habitsContainer');
      container.innerHTML = '';
      extraHabits.forEach((habit, idx) => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `
          <span>${habit} <span class="remove-btn" onclick="removeHabit(${idx})">[x]</span></span>
          <input type="checkbox" id="habit_${idx}">
        `;
        container.appendChild(div);
      });
      localStorage.setItem('saved_habit_labels', JSON.stringify(extraHabits));
    }

    function addNewHabit() {
      const name = prompt("Enter new habit name:");
      if (name && name.trim() !== '') {
        extraHabits.push(name.trim());
        renderHabitInputs();
      }
    }

    function removeHabit(idx) {
      extraHabits.splice(idx, 1);
      renderHabitInputs();
    }

    // ROUTINE STACK MANAGEMENT & RENDER
    function renderRoutineStack() {
      const container = document.getElementById('routineListContainer');
      container.innerHTML = '';
      routineStack.forEach((rItem, idx) => {
        const div = document.createElement('div');
        div.className = 'routine-item';
        div.id = `routine_item_${idx}`;
        div.innerHTML = `
          <span>${idx + 1}. ${rItem}</span>
          <input type="checkbox" onchange="toggleRoutineItem(${idx})">
        `;
        container.appendChild(div);
      });
    }

    function toggleRoutineItem(idx) {
      const el = document.getElementById(`routine_item_${idx}`);
      if (el) el.classList.toggle('done');
    }

    function openRoutineBox() {
      renderRoutineStack();
      document.getElementById('routineBox').classList.add('active');
    }

    function closeRoutineBox() {
      document.getElementById('routineBox').classList.remove('active');
      document.getElementById('status').innerText = "[✓] ROUTINE STACK COMPLETED!";
    }

    function manageRoutineList() {
      const currentText = routineStack.join('\n');
      const updated = prompt("Edit Routine Stack (one habit per line):", currentText);
      if (updated !== null) {
        const lines = updated.split('\n').map(l => l.trim()).filter(l => l !== '');
        if (lines.length > 0) {
          routineStack = lines;
          localStorage.setItem('saved_routine_stack', JSON.stringify(routineStack));
          
          // Sync with Google Sheet
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "saveRoutineList", routines: routineStack })
          });

          document.getElementById('status').innerText = "[✓] ROUTINE STACK UPDATED";
        }
      }
    }

    // SCREENSHOT UPLOADER INTEGRATION
    function triggerScreenshotUpload() {
      document.getElementById('screenshotInput').click();
    }

    async function handleScreenshotUpload(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      const tag = prompt("Select Tag:\n1. Knowledge\n2. Guide\n3. Code / Tech\n4. Finance\n5. Personal", "Knowledge") || "Knowledge";
      const statusDiv = document.getElementById('status');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        statusDiv.innerText = `[${i + 1}/${files.length}] AI EXTRACTING: ${file.name}...`;

        try {
          const base64Image = await fileToBase64(file);
          const now = new Date();
          const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          const payload = {
            action: "addScreenshot",
            date: formattedDate,
            tag: tag,
            image: base64Image
          };

          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error("Upload error:", err);
        }
      }

      statusDiv.innerText = `[✓] PROCESSED ${files.length} SCREENSHOT(S) TO LIBRARY TAB`;
      event.target.value = "";
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function addSexActivity() {
      const ejaculated = confirm("Did you ejaculate?\n\n[OK] = Yes\n[Cancel] = No");
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING ACTIVITY...";

      const now = new Date();
      const formattedDateTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const payload = {
        action: "addSexActivity",
        dateTime: formattedDateTime,
        ejaculated: ejaculated,
        dateLogged: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        const resultText = ejaculated ? "YES" : "NO";
        statusDiv.innerText = `[✓] LOGGED SEXUAL ACTIVITY (EJACULATED: ${resultText})`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING ACTIVITY";
      });
    }

    function addQuote() {
      const quote = prompt("Enter the quote:");
      if (!quote || quote.trim() === '') return;
      
      const author = prompt("Enter author name:") || "Anonymous";
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING QUOTE...";

      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const payload = {
        action: "addQuote",
        quote: quote.trim(),
        author: author.trim(),
        date: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] QUOTE SAVED TO QUOTES SHEET`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING QUOTE";
      });
    }

    function addKeyword() {
      const keyword = prompt("Enter keyword to log:");
      if (!keyword || keyword.trim() === '') return;

      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING KEYWORD...";

      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const payload = {
        action: "addKeyword",
        keyword: keyword.trim(),
        date: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] KEYWORD "${keyword.trim()}" SAVED`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING KEYWORD";
      });
    }

    function logWakeUp() {
      const wakeBtn = document.getElementById('wakeBtn');
      const statusDiv = document.getElementById('status');

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const currentDate = `${year}-${month}-${day}`;
      const currentTime = `${hours}:${minutes}`;

      wakeBtn.disabled = true;
      wakeBtn.innerText = "SAVING...";
      statusDiv.innerText = "";

      const habitsData = {};
      extraHabits.forEach((habit, idx) => {
        const chk = document.getElementById(`habit_${idx}`);
        if (chk) habitsData[habit] = chk.checked;
      });

      const payload = {
        date: currentDate,
        wakeTime: currentTime,
        smokeStreak: getSmokeStreakDays(),
        habits: habitsData
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] LOGGED AT ${currentTime}`;
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";

        extraHabits.forEach((_, idx) => {
          const chk = document.getElementById(`habit_${idx}`);
          if (chk) chk.checked = false;
        });

        // Trigger Routine Stack Container
        openRoutineBox();

        setTimeout(fetchDashboardData, 1000);
      })
      .catch(err => {
        statusDiv.innerText = "[X] ERROR RECORDING";
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";
      });
    }

    renderHabitInputs();
    fetchDashboardData();
    calculateSmokeStreak();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOG // PERSONAL & WIFE TRACKER</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --border: #e5e5e5;
      --font: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      border: 2px solid var(--fg);
      padding: 24px;
      box-shadow: 6px 6px 0px var(--fg);
      margin-bottom: 30px;
    }

    .wife-container {
      width: 100%;
      max-width: 420px;
      border: 2px solid var(--fg);
      padding: 24px;
      box-shadow: 6px 6px 0px var(--fg);
      background: #fafafa;
    }

    .quote-box {
      border: 1px solid var(--fg);
      padding: 12px;
      margin-bottom: 20px;
      text-align: center;
      background: #fafafa;
    }

    .quote-text {
      font-size: 0.8rem;
      font-style: italic;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .quote-author {
      font-size: 0.65rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--fg);
      padding-bottom: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .kpi-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .kpi-card {
      border: 1px solid var(--fg);
      text-align: center;
      padding: 10px 4px;
      background: #fff;
    }

    .kpi-val {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .kpi-lbl {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    button.wake-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--fg);
      color: var(--bg);
      border: none;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 10px;
    }

    button.wake-btn:hover { background-color: #333; }

    .routine-box {
      display: none;
      border: 2px solid var(--fg);
      padding: 14px;
      margin-bottom: 20px;
      background: #ffffff;
    }

    .routine-box.active { display: block; }

    .routine-title {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid var(--fg);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }

    .routine-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      padding: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }

    .routine-item.done {
      text-decoration: line-through;
      opacity: 0.5;
      background: #f0f0f0;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    button.secondary-btn {
      width: 100%;
      padding: 8px;
      background-color: var(--bg);
      color: var(--fg);
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }

    button.secondary-btn:hover { background-color: #f0f0f0; }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      margin-top: 10px;
    }

    label {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .add-btn {
      background: none;
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.7rem;
      padding: 2px 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-btn:hover { background: var(--fg); color: var(--bg); }

    .checkbox-group { display: flex; flex-direction: column; gap: 8px; }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      padding: 8px 10px;
      font-size: 0.8rem;
      background: #fff;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--fg);
      cursor: pointer;
    }

    .remove-btn {
      color: #999;
      cursor: pointer;
      font-size: 0.7rem;
      margin-left: 6px;
    }

    .remove-btn:hover { color: var(--fg); font-weight: bold; }

    .form-group { margin-bottom: 12px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--fg);
      font-family: var(--font);
      font-size: 0.75rem;
      background: #fff;
      outline: none;
    }

    textarea { resize: vertical; min-height: 50px; }

    .info-box {
      border: 1px solid var(--fg);
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.7rem;
      line-height: 1.4;
      background: #fff;
    }

    .knowledge-box {
      display: none;
      border: 1px solid var(--fg);
      padding: 12px;
      margin-bottom: 16px;
      background: #ffffff;
      font-size: 0.7rem;
      line-height: 1.4;
    }

    .knowledge-box.active { display: block; }

    .knowledge-section-title {
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 8px;
      margin-bottom: 4px;
      border-bottom: 1px dashed var(--fg);
      padding-bottom: 2px;
    }

    #status {
      margin-top: 16px;
      font-size: 0.7rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- PERSONAL HABIT TRACKER CONTAINER -->
  <div class="container">
    <div class="quote-box">
      <div class="quote-text" id="quoteText">"Loading daily motivation..."</div>
      <div class="quote-author" id="quoteAuthor">--</div>
    </div>

    <h1>LOG // MY HABITS</h1>

    <!-- 3-KPI DASHBOARD -->
    <div class="kpi-grid-3">
      <div class="kpi-card">
        <div class="kpi-val" id="cleanMindVal">0</div>
        <div class="kpi-lbl">Clean Mind</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val" id="smokeStreakDisplay">0</div>
        <div class="kpi-lbl">Smoke Free</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val" id="streakDisplay">--</div>
        <div class="kpi-lbl">&lt; 5 AM Streak</div>
      </div>
    </div>

    <button type="button" class="wake-btn" id="wakeBtn" onclick="logWakeUp()">LOG WAKE UP NOW</button>
    
    <div class="routine-box" id="routineBox">
      <div class="routine-title">⚡ ROUTINE STACK (CHECK AS YOU GO)</div>
      <div id="routineListContainer"></div>
      <button type="button" class="secondary-btn" style="margin-top:10px;" onclick="closeRoutineBox()">COMPLETE ROUTINE STACK</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="logLapsePrompt()">Log Clean Lapse</button>
      <button type="button" class="secondary-btn" onclick="addSexActivity()">+ Sex Activity</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="addQuote()">+ Add Quote</button>
      <button type="button" class="secondary-btn" onclick="addKeyword()">+ Add Keyword</button>
    </div>

    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="manageRoutineList()">⚙ Manage Routines</button>
      <button type="button" class="secondary-btn" onclick="resetSmokeQuitDate()">Reset Smoke Quit</button>
    </div>

    <div class="section-header">
      <label>Additional Habits</label>
      <button type="button" class="add-btn" onclick="addNewHabit()">+ Add Habit</button>
    </div>
    <div class="checkbox-group" id="habitsContainer"></div>
  </div>

  <!-- SEPARATE WIFE CYCLE & CARE TRACKER CONTAINER -->
  <div class="wife-container">
    <h1>WIFE CYCLE & CARE</h1>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-val" id="wifeCycleDayVal">--</div>
        <div class="kpi-lbl">Cycle Day</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-val" id="wifePhaseVal" style="font-size: 0.95rem; padding-top: 6px;">--</div>
        <div class="kpi-lbl">Current Phase</div>
      </div>
    </div>

    <div class="info-box">
      <strong>CARE / COMFORT GUIDE FOR TODAY:</strong><br>
      <span id="wifeCareGuide">Loading phase advice...</span>
    </div>

    <button type="button" class="secondary-btn" style="margin-bottom: 8px;" onclick="toggleKnowledgeBox()">📖 VIEW DEEP KNOWLEDGE & MECHANISMS</button>

    <div class="knowledge-box" id="knowledgeBox">
      <div id="knowledgeContent">Loading mechanisms...</div>
    </div>

    <div class="form-group">
      <label>Her Experience / Symptoms Today</label>
      <input type="text" id="wifeExperienceInput" placeholder="e.g. Cramps, low energy, craving sweets, happy">
    </div>

    <div class="form-group">
      <label>Your Personal Note / Actions Taken</label>
      <textarea id="wifeNotesInput" placeholder="e.g. Made warm ginger tea, massaged lower back, bought dark chocolate"></textarea>
    </div>

    <button type="button" class="wake-btn" onclick="logWifeCycle()">SAVE WIFE CYCLE LOG</button>
    
    <div class="btn-grid">
      <button type="button" class="secondary-btn" onclick="logPeriodEnd()">Log Period Ended Today</button>
      <button type="button" class="secondary-btn" onclick="resetWifeCycleStartDate()">Update Start Date</button>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz06Huj6D6PvgvmsxX7vgAQTyM-FNmIz5f9-Vau8QYOh37aJuu2n887DUVVN_sCKm_3_A/exec';
    let extraHabits = JSON.parse(localStorage.getItem('saved_habit_labels')) || ['Reading', 'Exercise'];
    let routineStack = JSON.parse(localStorage.getItem('saved_routine_stack')) || ['Drink 500ml Water', 'Make Bed', '5 Min Stretch', 'Cold Shower'];
    let smokeQuitDate = localStorage.getItem('smoke_quit_date') || '2026-08-01';
    let cleanMindStartDate = localStorage.getItem('clean_mind_start_date') || '2026-09-01';
    let wifeCycleStart = localStorage.getItem('wife_cycle_start_date') || '2026-09-24';

    function getCleanMindDays() {
      const start = new Date(cleanMindStartDate);
      const today = new Date();
      start.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diffTime = today - start;
      return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
    }

    function calculateCleanStreak() {
      document.getElementById('cleanMindVal').innerText = getCleanMindDays();
    }

    function logLapsePrompt() {
      const prevStreak = getCleanMindDays();
      const details = prompt(`[LOG LAPSE]\nPrevious Streak: ${prevStreak} Days\n\nEnter full details of what happened (triggers, feelings, context):`);
      
      if (details === null) return;

      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const formattedTimestamp = `${formattedDate} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      // Reset clean start date to today
      cleanMindStartDate = formattedDate;
      localStorage.setItem('clean_mind_start_date', cleanMindStartDate);
      calculateCleanStreak();

      const payload = {
        action: "addCleanLapseLog",
        dateTime: formattedTimestamp,
        previousStreak: prevStreak,
        notes: details.trim() || "No notes entered",
        newStartDate: formattedDate
      };

      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING LAPSE LOG...";

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = "[!] LAPSE LOGGED TO SHEET. STREAK RESET TO 0. STAY STRONG!";
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING LAPSE LOG";
      });
    }

    function getCycleDetails() {
      const start = new Date(wifeCycleStart);
      const today = new Date();
      start.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      const diffTime = today - start;
      const dayNum = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
      
      const cycleDayMod = ((dayNum - 1) % 28) + 1;

      let phase = "";
      let guide = "";
      let knowledgeHtml = "";

      if (cycleDayMod >= 1 && cycleDayMod <= 5) {
        phase = "Menstrual (Days 1-5)";
        guide = "Rest & Nourish: Provide warm meals, ginger tea, heat pad, and let her get extra sleep. Avoid scheduling strenuous plans.";
        
        knowledgeHtml = `
          <div class="knowledge-section-title">🔬 WESTERN MEDICAL SCIENCE</div>
          Progesterone & Estrogen plummet to lowest levels, triggering arterial constriction in the endometrium and shedding of the lining. Systemic energy is lowest, pain tolerance decreases, and inflammation rises.
          
          <div class="knowledge-section-title">☯ TRADITIONAL MEDICINE (TCM / TNM)</div>
          Yang transforms into Yin. Liver Qi must move smoothly to allow Blood (Huyết) to empty completely without stagnation or cramping. Keep abdomen warm and avoid cold foods/drinks.

          <div class="knowledge-section-title">🌕 ESOTERIC & LUNAR ARCHETYPE</div>
          New Moon / Crone Archetype (Inner Winter). A period of natural physical/energetic cleansing, introspection, deep intuition, and need for quiet sanctuary.
        `;
      } else if (cycleDayMod >= 6 && cycleDayMod <= 11) {
        phase = "Follicular (Days 6-11)";
        guide = "Energy Rising: Estrogen is up. Great time for active outings, social dates, trying new experiences, and collaborative goals.";
        
        knowledgeHtml = `
          <div class="knowledge-section-title">🔬 WESTERN MEDICAL SCIENCE</div>
          FSH stimulates ovarian follicles while rising Estrogen builds a new uterine lining. Estrogen increases serotonin and dopamine, boosting mental clarity, stamina, and social openness.
          
          <div class="knowledge-section-title">☯ TRADITIONAL MEDICINE (TCM / TNM)</div>
          Yin & Blood Building Phase. Depleted Yin and Blood post-menses are rebuilt through Kidney Essence (Tinh) and Spleen nourishment. Encourage nutrient-dense, blood-building warm foods.

          <div class="knowledge-section-title">🌕 ESOTERIC & LUNAR ARCHETYPE</div>
          Waxing Moon / Maiden Archetype (Inner Spring). Symbolizes rebirth, optimism, mental focus, curiosity, and new beginnings.
        `;
      } else if (cycleDayMod >= 12 && cycleDayMod <= 16) {
        phase = "Ovulatory (Days 12-16)";
        guide = "Peak Confidence & Libido: High energy. Express love directly, plan romantic dates, communicate openly, and enjoy high connection.";
        
        knowledgeHtml = `
          <div class="knowledge-section-title">🔬 WESTERN MEDICAL SCIENCE</div>
          Estrogen peaks, triggering an LH surge that releases the egg. Testosterone peaks, driving max physical strength, heightened verbal fluency, high confidence, and peak sex drive.
          
          <div class="knowledge-section-title">☯ TRADITIONAL MEDICINE (TCM / TNM)</div>
          Yin reaches its peak and transforms into Yang. Chong (Sea of Blood) and Ren vessels fill completely to release energy. Foster open emotional expression.

          <div class="knowledge-section-title">🌕 ESOTERIC & LUNAR ARCHETYPE</div>
          Full Moon / Mother Archetype (Inner Summer). Peak magnetic presence, expressive warmth, creativity, and deep outward connection.
        `;
      } else {
        phase = "Luteal / PMS (Days 17-28)";
        guide = "Support & Calm: Progesterone rises then drops. Offer extra patience, healthy comfort food, clean up without asking, and avoid conflict.";
        
        knowledgeHtml = `
          <div class="knowledge-section-title">🔬 WESTERN MEDICAL SCIENCE</div>
          Corpus Luteum releases high Progesterone to calm the central nervous system and raise metabolic rate. As hormones drop near Day 25-28, fluid retention, mood shifts, and PMS emerge.
          
          <div class="knowledge-section-title">☯ TRADITIONAL MEDICINE (TCM / TNM)</div>
          Yang Warming & Qi Moving Phase. If Liver Qi stagnates from stress or unexpressed emotions, PMS tension and breast tenderness occur. Soothe Liver with gentle movement and chamomile/rose tea.

          <div class="knowledge-section-title">🌕 ESOTERIC & LUNAR ARCHETYPE</div>
          Waning Moon / Enchantress Archetype (Inner Autumn). A phase of boundary-setting, detail focus, discernment, and cutting through fluff.
        `;
      }

      return { dayNum, cycleDayMod, phase, guide, knowledgeHtml };
    }

    function updateWifeCycleUI() {
      const details = getCycleDetails();
      document.getElementById('wifeCycleDayVal').innerText = `Day ${details.cycleDayMod}`;
      document.getElementById('wifePhaseVal').innerText = details.phase;
      document.getElementById('wifeCareGuide').innerText = details.guide;
      document.getElementById('knowledgeContent').innerHTML = details.knowledgeHtml;
    }

    function toggleKnowledgeBox() {
      document.getElementById('knowledgeBox').classList.toggle('active');
    }

    function logPeriodEnd() {
      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const details = getCycleDetails();

      const payload = {
        action: "addWifeCycleLog",
        date: formattedDate,
        cycleDay: `Day ${details.cycleDayMod}`,
        hormonePhase: details.phase,
        experience: "Menses Stopped / End of Period",
        comfortGuide: "Transition to Follicular Phase (Energy rising)",
        notes: `Period ended on Day ${details.cycleDayMod}`,
        timestamp: `${formattedDate} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById('status').innerText = `[✓] PERIOD END LOGGED FOR TODAY (DAY ${details.cycleDayMod})`;
      });
    }

    function resetWifeCycleStartDate() {
      const input = prompt("Enter new cycle start date (YYYY-MM-DD):", wifeCycleStart);
      if (input && input.trim() !== '') {
        wifeCycleStart = input.trim();
        localStorage.setItem('wife_cycle_start_date', wifeCycleStart);
        updateWifeCycleUI();
        document.getElementById('status').innerText = `[!] CYCLE START DATE UPDATED TO ${wifeCycleStart}`;
      }
    }

    function logWifeCycle() {
      const exp = document.getElementById('wifeExperienceInput').value;
      const notes = document.getElementById('wifeNotesInput').value;
      const statusDiv = document.getElementById('status');

      statusDiv.innerText = "SAVING WIFE CYCLE LOG...";

      const details = getCycleDetails();
      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      const formattedTimestamp = `${formattedDate} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const payload = {
        action: "addWifeCycleLog",
        date: formattedDate,
        cycleDay: `Day ${details.cycleDayMod}`,
        hormonePhase: details.phase,
        experience: exp || "Normal / Unspecified",
        comfortGuide: details.guide,
        notes: notes || "-",
        timestamp: formattedTimestamp
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] WIFE CYCLE LOG SAVED (DAY ${details.cycleDayMod})`;
        document.getElementById('wifeExperienceInput').value = "";
        document.getElementById('wifeNotesInput').value = "";
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING WIFE CYCLE LOG";
      });
    }

    function getSmokeStreakDays() {
      const quit = new Date(smokeQuitDate);
      const today = new Date();
      const diffTime = today - quit;
      return Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
    }

    function calculateSmokeStreak() {
      document.getElementById('smokeStreakDisplay').innerText = getSmokeStreakDays();
    }

    function resetSmokeQuitDate() {
      if (confirm("Reset smoke quit date to today?")) {
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, '0');
        const day = String(today.getDate()).padStart(2, '0');
        
        smokeQuitDate = `${year}-${month}-${day}`;
        localStorage.setItem('smoke_quit_date', smokeQuitDate);
        calculateSmokeStreak();
        document.getElementById('status').innerText = "[!] SMOKE QUIT DATE RESET TO TODAY";
      }
    }

    function fetchDashboardData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'success') {
            document.getElementById('streakDisplay').innerText = data.streak;
            document.getElementById('quoteText').innerText = `"${data.quote}"`;
            document.getElementById('quoteAuthor').innerText = `- ${data.author}`;
            if (data.routines && data.routines.length > 0) {
              routineStack = data.routines;
              localStorage.setItem('saved_routine_stack', JSON.stringify(routineStack));
            }
          }
        })
        .catch(() => {
          document.getElementById('streakDisplay').innerText = '0';
          document.getElementById('quoteText').innerText = '"Every day is a new beginning."';
          document.getElementById('quoteAuthor').innerText = '- UNKNOWN';
        });
    }

    function renderHabitInputs() {
      const container = document.getElementById('habitsContainer');
      container.innerHTML = '';
      extraHabits.forEach((habit, idx) => {
        const div = document.createElement('div');
        div.className = 'checkbox-item';
        div.innerHTML = `
          <span>${habit} <span class="remove-btn" onclick="removeHabit(${idx})">[x]</span></span>
          <input type="checkbox" id="habit_${idx}">
        `;
        container.appendChild(div);
      });
      localStorage.setItem('saved_habit_labels', JSON.stringify(extraHabits));
    }

    function addNewHabit() {
      const name = prompt("Enter new habit name:");
      if (name && name.trim() !== '') {
        extraHabits.push(name.trim());
        renderHabitInputs();
      }
    }

    function removeHabit(idx) {
      extraHabits.splice(idx, 1);
      renderHabitInputs();
    }

    function renderRoutineStack() {
      const container = document.getElementById('routineListContainer');
      container.innerHTML = '';
      routineStack.forEach((rItem, idx) => {
        const div = document.createElement('div');
        div.className = 'routine-item';
        div.id = `routine_item_${idx}`;
        div.innerHTML = `
          <span>${idx + 1}. ${rItem}</span>
          <input type="checkbox" onchange="toggleRoutineItem(${idx})">
        `;
        container.appendChild(div);
      });
    }

    function toggleRoutineItem(idx) {
      const el = document.getElementById(`routine_item_${idx}`);
      if (el) el.classList.toggle('done');
    }

    function openRoutineBox() {
      renderRoutineStack();
      document.getElementById('routineBox').classList.add('active');
    }

    function closeRoutineBox() {
      document.getElementById('routineBox').classList.remove('active');
      document.getElementById('status').innerText = "[✓] ROUTINE STACK COMPLETED!";
    }

    function manageRoutineList() {
      const currentText = routineStack.join('\n');
      const updated = prompt("Edit Routine Stack (one habit per line):", currentText);
      if (updated !== null) {
        const lines = updated.split('\n').map(l => l.trim()).filter(l => l !== '');
        if (lines.length > 0) {
          routineStack = lines;
          localStorage.setItem('saved_routine_stack', JSON.stringify(routineStack));
          
          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: "saveRoutineList", routines: routineStack })
          });

          document.getElementById('status').innerText = "[✓] ROUTINE STACK UPDATED";
        }
      }
    }

    function addSexActivity() {
      const ejaculated = confirm("Did you ejaculate?\n\n[OK] = Yes\n[Cancel] = No");
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING ACTIVITY...";

      const now = new Date();
      const formattedDateTime = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const payload = {
        action: "addSexActivity",
        dateTime: formattedDateTime,
        ejaculated: ejaculated,
        dateLogged: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        const resultText = ejaculated ? "YES" : "NO";
        statusDiv.innerText = `[✓] LOGGED SEXUAL ACTIVITY (EJACULATED: ${resultText})`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING ACTIVITY";
      });
    }

    function addQuote() {
      const quote = prompt("Enter the quote:");
      if (!quote || quote.trim() === '') return;
      
      const author = prompt("Enter author name:") || "Anonymous";
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING QUOTE...";

      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      const payload = {
        action: "addQuote",
        quote: quote.trim(),
        author: author.trim(),
        date: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] QUOTE SAVED TO QUOTES SHEET`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING QUOTE";
      });
    }

    function addKeyword() {
      const keyword = prompt("Enter keyword to log:");
      if (!keyword || keyword.trim() === '') return;

      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "SAVING KEYWORD...";

      const now = new Date();
      const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const payload = {
        action: "addKeyword",
        keyword: keyword.trim(),
        date: formattedDate
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] KEYWORD "${keyword.trim()}" SAVED`;
      })
      .catch(() => {
        statusDiv.innerText = "[X] ERROR SAVING KEYWORD";
      });
    }

    function logWakeUp() {
      const wakeBtn = document.getElementById('wakeBtn');
      const statusDiv = document.getElementById('status');

      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      const currentDate = `${year}-${month}-${day}`;
      const currentTime = `${hours}:${minutes}`;

      wakeBtn.disabled = true;
      wakeBtn.innerText = "SAVING...";
      statusDiv.innerText = "";

      const habitsData = {};
      extraHabits.forEach((habit, idx) => {
        const chk = document.getElementById(`habit_${idx}`);
        if (chk) habitsData[habit] = chk.checked;
      });

      const payload = {
        date: currentDate,
        wakeTime: currentTime,
        smokeStreak: getSmokeStreakDays(),
        cleanStreak: getCleanMindDays(),
        habits: habitsData
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusDiv.innerText = `[✓] LOGGED AT ${currentTime}`;
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";

        extraHabits.forEach((_, idx) => {
          const chk = document.getElementById(`habit_${idx}`);
          if (chk) chk.checked = false;
        });

        openRoutineBox();
        setTimeout(fetchDashboardData, 1000);
      })
      .catch(err => {
        statusDiv.innerText = "[X] ERROR RECORDING";
        wakeBtn.disabled = false;
        wakeBtn.innerText = "LOG WAKE UP NOW";
      });
    }

    // Initialize
    renderHabitInputs();
    fetchDashboardData();
    calculateSmokeStreak();
    calculateCleanStreak();
    updateWifeCycleUI();
  </script>
</body>
</html>
